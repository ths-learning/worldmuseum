<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER-VOCAB: 專業詞彙射擊</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00f3ff;
            --pink: #ff003c;
            --purple: #b026ff;
            --dark: #050510;
            --panel-bg: rgba(5, 8, 24, 0.9);
            --border-glow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--dark);
            overflow: hidden;
            font-family: 'Noto Sans TC', sans-serif;
            touch-action: none;
            color: white;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 600px;
            margin: 0 auto;
            background: linear-gradient(to bottom, #050a1f, #020205);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        canvas {
            display: block;
            width: 100%;
            flex: 1;
            background-color: transparent;
            z-index: 1;
        }

        .grid-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 110px;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.04) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 2;
        }

        #hud-bar {
            height: 110px;
            background: var(--panel-bg);
            border-top: 3px solid var(--cyan);
            box-shadow: 0 -5px 25px rgba(0, 243, 255, 0.25), inset 0 0 15px rgba(0, 243, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            box-sizing: border-box;
            z-index: 10;
            position: relative;
        }

        #hud-bar::before, #hud-bar::after {
            content: '';
            position: absolute;
            top: -3px;
            width: 15px;
            height: 6px;
            background: white;
            box-shadow: 0 0 8px white;
        }
        #hud-bar::before { left: 10%; }
        #hud-bar::after { right: 10%; }

        .hud-block {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }

        .hud-left {
            flex: 1.2;
            max-width: 50%;
        }

        .hud-center {
            flex: 0.8;
            align-items: center;
            border-left: 1px dashed rgba(0, 243, 255, 0.3);
            border-right: 1px dashed rgba(0, 243, 255, 0.3);
            margin: 0 5px;
        }

        .hud-right {
            flex: 1;
            align-items: flex-end;
        }

        .hud-label {
            color: rgba(0, 243, 255, 0.6);
            font-size: 11px;
            letter-spacing: 1px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .target-title {
            color: #ffde00;
            font-size: 16px;
            font-weight: 900;
            margin: 2px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 0 5px rgba(255, 222, 0, 0.3);
        }

        #switch-timer {
            font-size: 11px;
            color: #aaa;
        }

        .timer-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 34px;
            color: var(--pink);
            font-weight: 900;
            line-height: 1;
            text-shadow: 0 0 8px rgba(255, 0, 60, 0.5);
        }

        .score-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            color: var(--cyan);
            font-weight: 900;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
        }

        .agent-id {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
        }

        .screen-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 2, 5, 0.88);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            padding: 20px;
            box-sizing: border-box;
        }

        .cyber-panel {
            background: rgba(8, 12, 28, 0.95);
            border: 2px solid var(--cyan);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.3), inset 0 0 20px rgba(0, 243, 255, 0.15);
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
            padding: 25px;
            box-sizing: border-box;
            position: relative;
        }
        
        .cyber-panel::before, .cyber-panel::after {
            content: ''; position: absolute; width: 25px; height: 3px; background: var(--cyan);
        }
        .cyber-panel::before { top: -2px; left: -2px; }
        .cyber-panel::after { bottom: -2px; right: -2px; }

        .glitch-title {
            font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
            font-size: 30px;
            font-weight: 900;
            text-align: center;
            color: #fff;
            text-shadow: 2px 2px 0px var(--pink), -2px -2px 0px var(--cyan);
            margin-top: 0;
            margin-bottom: 20px;
            letter-spacing: 2px;
            line-height: 1.2;
        }

        .cyber-input {
            width: 100%;
            background: rgba(0, 243, 255, 0.05);
            border: none;
            border-bottom: 2px solid var(--cyan);
            color: var(--cyan);
            font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
            font-size: 18px;
            padding: 10px;
            box-sizing: border-box;
            outline: none;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        .cyber-input:focus {
            background: rgba(0, 243, 255, 0.15);
            box-shadow: 0 5px 15px rgba(0, 243, 255, 0.2);
        }
        .cyber-input::placeholder { color: rgba(0, 243, 255, 0.3); }

        .cyber-btn {
            display: block;
            width: 100%;
            background: transparent;
            color: var(--cyan);
            border: 1px solid var(--cyan);
            font-family: 'Noto Sans TC', sans-serif;
            font-weight: 900;
            font-size: 18px;
            padding: 12px;
            margin-bottom: 15px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            transition: 0.2s;
            border-radius: 4px;
        }
        .cyber-btn:hover, .cyber-btn:active {
            background: var(--cyan);
            color: var(--dark);
            box-shadow: 0 0 15px var(--cyan);
        }
        .cyber-btn.primary {
            background: rgba(0, 243, 255, 0.1);
            border: 2px solid var(--cyan);
            box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.3);
        }
        .cyber-btn.danger {
            color: var(--pink); border-color: var(--pink);
        }
        .cyber-btn.danger:hover, .cyber-btn.danger:active {
            background: var(--pink); color: white; box-shadow: 0 0 15px var(--pink);
        }

        .notes-container {
            margin-top: 15px;
            max-height: 180px;
            overflow-y: auto;
            border-top: 1px dashed rgba(0, 243, 255, 0.2);
            padding-top: 15px;
        }
        .notes-container::-webkit-scrollbar { width: 4px; }
        .notes-container::-webkit-scrollbar-thumb { background: var(--cyan); }
        
        .note-item {
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--purple);
            margin-bottom: 8px;
            border-radius: 0 4px 4px 0;
            overflow: hidden;
        }
        .note-summary {
            padding: 8px 10px;
            color: #fff;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            outline: none;
            user-select: none;
            background: rgba(0, 243, 255, 0.05);
        }
        .note-content {
            padding: 8px 10px;
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            line-height: 1.5;
            background: rgba(5, 5, 10, 0.5);
        }
        .tag {
            display: inline-block; background: rgba(176, 38, 255, 0.15);
            border: 1px solid var(--purple); border-radius: 3px;
            padding: 2px 6px; margin: 2px; font-size: 11px; color: #e0b3ff;
        }

        .lb-list {
            list-style: none; padding: 0; margin: 0 0 20px 0;
            max-height: 250px; overflow-y: auto;
        }
        .lb-list::-webkit-scrollbar { width: 4px; }
        .lb-list::-webkit-scrollbar-thumb { background: var(--cyan); }
        .lb-item {
            display: flex; justify-content: space-between;
            padding: 10px; border-bottom: 1px solid rgba(0,243,255,0.2);
            font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
            font-size: 14px;
        }
        .lb-item:nth-child(1) { color: #ffde00; font-weight: bold; font-size: 16px;}
        .lb-item:nth-child(2) { color: #e2e8f0; font-weight: bold; }
        .lb-item:nth-child(3) { color: #b45309; font-weight: bold; }
        
        .loading-text { text-align: center; color: var(--cyan); font-size: 14px; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .control-hint {
            font-size: 13px; color: rgba(255,255,255,0.5); text-align: center;
            background: rgba(0,0,0,0.5); padding: 8px; border-radius: 5px;
            margin-bottom: 15px; border-left: 2px solid var(--cyan);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="grid-overlay"></div>
    
    <canvas id="gameCanvas"></canvas>

    <div id="hud-bar" class="hidden">
        <div class="hud-block hud-left">
            <span class="hud-label">TARGET SYS</span>
            <span id="target-title" class="target-title">載入中</span>
            <span id="switch-timer">切換中...</span>
        </div>
        <div class="hud-block hud-center">
            <span class="hud-label">TIME</span>
            <span id="main-timer" class="timer-val">99</span>
        </div>
        <div class="hud-block hud-right">
            <span class="hud-label">SCORE</span>
            <span id="score-display" class="score-val">0</span>
            <span id="hud-agent" class="agent-id">AGENT: ---</span>
        </div>
    </div>

    <div id="home-screen" class="screen-modal">
        <div class="cyber-panel">
            <h1 class="glitch-title">CYBER-VOCAB<br><span style="font-size:16px; color:var(--cyan); text-shadow:none; letter-spacing: 1px;">學科專業詞彙特訓</span></h1>
            
            <input type="text" id="player-name" class="cyber-input" placeholder="輸入特工代號 (必填)" maxlength="10">
            
            <button id="btn-start" class="cyber-btn primary">START MISSION</button>
            <button id="btn-leaderboard" class="cyber-btn">GLOBAL RANKING</button>

            <div class="notes-container">
                <div style="font-size:12px; color:var(--cyan); margin-bottom:5px; font-weight: bold;">[ 檔案庫 : 溫習筆記 ]</div>
                <div id="notes-list"></div>
            </div>
        </div>
    </div>

    <div id="leaderboard-screen" class="screen-modal hidden">
        <div class="cyber-panel">
            <h1 class="glitch-title" style="font-size:22px;">GLOBAL RANKING</h1>
            <div id="lb-loading" class="loading-text">連線至資料庫中...</div>
            <ul id="lb-list" class="lb-list hidden">
                <!-- 排行榜資料 -->
            </ul>
            <button id="btn-lb-back" class="cyber-btn danger">BACK TO MENU</button>
        </div>
    </div>

    <div id="game-over-screen" class="screen-modal hidden">
        <div class="cyber-panel" style="text-align: center;">
            <h1 class="glitch-title" style="color:var(--pink); text-shadow: 2px 2px 0px white;">MISSION END</h1>
            
            <div style="margin: 20px 0;">
                <div class="hud-label" style="font-size:14px;">FINAL SCORE</div>
                <div id="final-score" style="font-size: 50px; font-family: 'Orbitron'; color: var(--cyan); font-weight: 900; text-shadow: 0 0 15px var(--cyan);">0</div>
            </div>

            <p id="save-status" style="font-size:13px; color:var(--purple); font-weight: bold;">記錄同步中...</p>

            <div class="control-hint" style="text-align:left; margin-top:15px; font-size: 12px; line-height: 1.4;">
                <b>任務摘要：</b><br>
                - 需連續命中 <span style="color:var(--cyan); font-weight: bold;">10 發</span> 才能摧毀裝甲敵機。<br>
                - 戰機具備穿透護盾，相撞 <span style="color:var(--cyan); font-weight: bold;">完全不扣分</span> 且直接穿透。
            </div>

            <button id="btn-retry" class="cyber-btn primary">RETRY MISSION</button>
            <button id="btn-home" class="cyber-btn">MAIN MENU</button>
        </div>
    </div>
</div>

<script type="module">
    // 正確導入 Firebase SDK
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Firebase 設定
    const firebaseConfig = {
        apiKey: "AIzaSyDKVsc9Y0Voo0pvU_7ZN90KdmyvKOBr_O0",
        authDomain: "conceptshoot-f24d7.firebaseapp.com",
        projectId: "conceptshoot-f24d7",
        storageBucket: "conceptshoot-f24d7.firebasestorage.app",
        messagingSenderId: "607132351767",
        appId: "1:607132351767:web:873a11288bb8bbed868b52",
        measurementId: "G-9J3Z5CBYN7"
    };

    // 初始化 Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 匿名登入，確保寫入權限 (符合 Firebase 規則)
    let currentUser = null;
    signInAnonymously(auth)
        .then((userCredential) => {
            currentUser = userCredential.user;
            console.log("匿名登入成功，UID:", currentUser.uid);
        })
        .catch((error) => {
            console.error("匿名登入失敗，排行榜與儲存功能將無法使用", error);
        });

    // ----------------------------------------------------
    // DOM 綁定
    // ----------------------------------------------------
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');

    const screens = {
        home: document.getElementById('home-screen'),
        hud: document.getElementById('hud-bar'),
        leaderboard: document.getElementById('leaderboard-screen'),
        gameover: document.getElementById('game-over-screen')
    };

    const ui = {
        playerNameInput: document.getElementById('player-name'),
        btnStart: document.getElementById('btn-start'),
        btnLb: document.getElementById('btn-leaderboard'),
        btnLbBack: document.getElementById('btn-lb-back'),
        btnRetry: document.getElementById('btn-retry'),
        btnHome: document.getElementById('btn-home'),
        notesList: document.getElementById('notes-list'),
        
        hudScore: document.getElementById('score-display'),
        hudTarget: document.getElementById('target-title'),
        hudTimer: document.getElementById('main-timer'),
        hudSwitch: document.getElementById('switch-timer'),
        hudAgent: document.getElementById('hud-agent'),
        
        lbLoading: document.getElementById('lb-loading'),
        lbList: document.getElementById('lb-list'),
        finalScore: document.getElementById('final-score'),
        saveStatus: document.getElementById('save-status')
    };

    // ----------------------------------------------------
    // 專業學科題庫與筆記
    // ----------------------------------------------------
    const vocabGroups = [
        { id: 0, title: "旅遊產品特性", words: ["無形性", "差異性", "互補性", "不可保存性", "帶有風險"] },
        { id: 1, title: "SMART原則", words: ["明確性", "可衡量性", "一致性", "實際性", "有時限性"] },
        { id: 2, title: "成功景點的特性", words: ["高品質", "真實性", "獨特性", "吸客能力", "活動選擇及可達度"] },
        { id: 3, title: "顧客服務的性質", words: ["綜合性", "直接性", "情緒性", "時間性", "應變性"] },
        { id: 4, title: "優質顧客服務指標", words: ["可靠性", "可信性", "有形性", "關懷性", "反應性"] }
    ];

    function generateNotes() {
        ui.notesList.innerHTML = vocabGroups.map(group => `
            <details class="note-item">
                <summary class="note-summary">▶ ${group.title}</summary>
                <div class="note-content">
                    ${group.words.map(w => `<span class="tag">${w}</span>`).join('')}
                </div>
            </details>
        `).join('');
    }
    generateNotes();

    const cachedName = localStorage.getItem('cyberVocabPlayer');
    if (cachedName) ui.playerNameInput.value = cachedName;

    // ----------------------------------------------------
    // 遊戲核心邏輯
    // ----------------------------------------------------
    let gameState = 'HOME'; // HOME, PLAYING, GAMEOVER
    let score = 0;
    let currentTargetGroupId = 0; 
    let baseSpeed = 0.5; 
    let spawnRate = 80;  
    let frameCount = 0;
    let animationId;
    
    let gameStartTime = 0;
    const GAME_DURATION = 99;
    let lastSwitchTime = 0;
    const SWITCH_INTERVAL = 30000;

    let bullets = [];
    let enemies = [];
    let particles = [];
    let floatingTexts = [];
    let stars = [];

    for(let i=0; i<80; i++){
        stars.push({
            x: Math.random() * 600, y: Math.random() * 800,
            size: Math.random() * 1.5 + 0.5,
            speed: Math.random() * 3 + 1,
            color: Math.random() > 0.6 ? '#00f3ff' : '#ffffff'
        });
    }

    const HUD_BAR_HEIGHT = 110;
    const player = {
        x: 0, 
        y: 0,
        width: 48,
        height: 58,
        speed: 8,
        lastShot: 0,
        fireRate: 8
    };

    function resizeCanvas() {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight - HUD_BAR_HEIGHT; 
        player.y = canvas.height - 40; 
        if (player.x === 0) player.x = canvas.width / 2;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 滑動控制
    let isDragging = false;
    let startX = 0, playerStartX = 0;

    function startDrag(e) {
        if(gameState !== 'PLAYING') return;
        e.preventDefault(); 
        isDragging = true;
        startX = e.touches ? e.touches[0].clientX : e.clientX;
        playerStartX = player.x;
    }

    function moveDrag(e) {
        if (!isDragging || gameState !== 'PLAYING') return;
        e.preventDefault();
        const currentX = e.touches ? e.touches[0].clientX : e.clientX;
        player.x = playerStartX + (currentX - startX);
        if (player.x < player.width/2) player.x = player.width/2;
        if (player.x > canvas.width - player.width/2) player.x = canvas.width - player.width/2;
    }

    function endDrag() { isDragging = false; }

    canvas.addEventListener('touchstart', startDrag, {passive: false});
    canvas.addEventListener('touchmove', moveDrag, {passive: false});
    canvas.addEventListener('touchend', endDrag);
    canvas.addEventListener('mousedown', startDrag);
    canvas.addEventListener('mousemove', moveDrag);
    window.addEventListener('mouseup', endDrag);

    // UI 切換
    function switchScreen(activeScreen) {
        screens.home.classList.add('hidden');
        screens.hud.classList.add('hidden');
        screens.leaderboard.classList.add('hidden');
        screens.gameover.classList.add('hidden');

        if (activeScreen === 'game') {
            screens.hud.classList.remove('hidden');
        } else if (screens[activeScreen]) {
            screens[activeScreen].classList.remove('hidden');
        }
    }

    ui.btnStart.addEventListener('click', () => {
        const pName = ui.playerNameInput.value.trim();
        if (!pName) {
            alert('系統提示：請輸入特工代號才能開始任務！');
            ui.playerNameInput.focus();
            return;
        }
        localStorage.setItem('cyberVocabPlayer', pName);
        startMission();
    });

    ui.btnRetry.addEventListener('click', startMission);
    ui.btnHome.addEventListener('click', () => {
        gameState = 'HOME';
        switchScreen('home');
    });

    // 讀取排行榜 (使用簡潔的 leaderboard 集合)
    ui.btnLb.addEventListener('click', async () => {
        switchScreen('leaderboard');
        ui.lbLoading.classList.remove('hidden');
        ui.lbList.classList.add('hidden');
        ui.lbList.innerHTML = '';
        
        try {
            const leaderboardRef = collection(db, 'leaderboard');
            const q = query(leaderboardRef, orderBy('score', 'desc'), limit(10));
            const snapshot = await getDocs(q);
            let scores = [];
            snapshot.forEach(doc => scores.push(doc.data()));
            
            ui.lbLoading.classList.add('hidden');
            ui.lbList.classList.remove('hidden');
            
            if (scores.length === 0) {
                ui.lbList.innerHTML = '<li class="lb-item" style="justify-content:center;">目前尚無紀錄</li>';
            } else {
                ui.lbList.innerHTML = scores.map((s, i) => `
                    <li class="lb-item">
                        <span>#${i+1}</span>
                        <span style="flex:1; text-align:center;">${s.name}</span>
                        <span>${s.score} PTS</span>
                    </li>
                `).join('');
            }
        } catch (e) {
            ui.lbLoading.innerText = '排行榜讀取失敗：請檢查網路或 Firebase 設定';
            console.error(e);
        }
    });

    ui.btnLbBack.addEventListener('click', () => {
        switchScreen('home');
    });

    function startMission() {
        score = 0;
        baseSpeed = canvas.height * 0.001; 
        spawnRate = 80;
        
        currentTargetGroupId = Math.floor(Math.random() * vocabGroups.length);
        const now = Date.now();
        gameStartTime = now;
        lastSwitchTime = now;
        
        bullets = [];
        enemies = [];
        particles = [];
        floatingTexts = [];
        frameCount = 0;
        
        player.lastShot = 0; 
        isDragging = false;
        
        resizeCanvas();

        const agentName = localStorage.getItem('cyberVocabPlayer') || 'AGENT';
        ui.hudAgent.innerText = `AGENT: ${agentName}`;

        gameState = 'PLAYING';
        switchScreen('game');
    }

    async function gameOver() {
        gameState = 'GAMEOVER';
        switchScreen('gameover');
        
        ui.finalScore.innerText = score;
        const pName = ui.playerNameInput.value.trim() || 'Anonymous';
        
        // 上傳成績 (僅當已匿名登入成功時)
        if (db && currentUser) {
            ui.saveStatus.innerText = '同步成績至雲端中央資料庫...';
            ui.saveStatus.style.color = '#b026ff';
            try {
                const leaderboardRef = collection(db, 'leaderboard');
                await addDoc(leaderboardRef, {
                    name: pName,
                    score: score,
                    timestamp: Date.now(),
                    uid: currentUser.uid
                });
                ui.saveStatus.innerText = '✅ 成績成功上傳雲端！';
                ui.saveStatus.style.color = '#00f3ff';
            } catch (e) {
                console.error("上傳失敗", e);
                ui.saveStatus.innerText = '⚠️ 同步失敗 (已保存於本地)';
                ui.saveStatus.style.color = '#ff003c';
            }
        } else {
            ui.saveStatus.innerText = '單機模式 (未連結雲端資料庫)';
            ui.saveStatus.style.color = '#aaa';
        }
    }

    // 特效函數
    function createExplosion(x, y, color, isMassive = false) {
        const count = isMassive ? 35 : 15;
        const force = isMassive ? 14 : 8;
        for (let i = 0; i < count; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * force,
                vy: (Math.random() - 0.5) * force,
                life: 1, color: color,
                size: Math.random() * (isMassive ? 5 : 3) + 2
            });
        }
    }

    function createFloatingText(x, y, text, color, fontSize = 24) {
        floatingTexts.push({
            x: x, y: y, text: text, color: color, life: 1, vy: -1.5, fontSize: fontSize
        });
    }

    function spawnEnemy() {
        let groupId = Math.random() < 0.5 ? currentTargetGroupId : 
            [0,1,2,3,4].filter(id => id !== currentTargetGroupId)[Math.floor(Math.random() * 4)];
        
        const group = vocabGroups[groupId];
        const word = group.words[Math.floor(Math.random() * group.words.length)];
        
        const width = Math.max(100, (word.length * 16) + 30);
        const height = 44; 
        
        const elapsedGame = Math.max(0, (Date.now() - gameStartTime) / 1000);
        const timeProgress = Math.min(1, elapsedGame / GAME_DURATION);
        const currentEnemySpeed = baseSpeed + (timeProgress * baseSpeed * 3.5) + (Math.random() * 0.8);
        
        enemies.push({
            x: Math.random() * (canvas.width - width) + width/2,
            y: -height, width: width, height: height,
            text: word, groupId: groupId, speed: currentEnemySpeed,
            hp: 10, maxHp: 10, hitEffect: 0
        });
    }

    function update() {
        frameCount++;

        stars.forEach(star => {
            star.y += star.speed;
            if(star.y > canvas.height) {
                star.y = 0; star.x = Math.random() * canvas.width;
            }
        });

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.03;
            if (p.life <= 0) particles.splice(i, 1);
        }

        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            let ft = floatingTexts[i]; ft.y += ft.vy; ft.life -= 0.015;
            if (ft.life <= 0) floatingTexts.splice(i, 1);
        }

        if (gameState !== 'PLAYING') return;

        const now = Date.now();
        const elapsedGame = Math.floor((now - gameStartTime) / 1000);
        const gameTimeLeft = Math.max(0, GAME_DURATION - elapsedGame);
        
        ui.hudScore.innerText = score;
        let title = vocabGroups[currentTargetGroupId].title;
        ui.hudTarget.innerText = title.length > 8 ? title.substring(0,7)+'...' : title;
        ui.hudTimer.innerText = gameTimeLeft;
        ui.hudTimer.style.color = gameTimeLeft <= 10 ? '#ff003c' : '#fff';
        
        const switchTimeLeft = Math.max(0, Math.ceil((SWITCH_INTERVAL - (now - lastSwitchTime)) / 1000));
        ui.hudSwitch.innerText = `隨機換組 countdown: ${switchTimeLeft}s`;

        if (gameTimeLeft === 0) { gameOver(); return; }

        if (now - lastSwitchTime > SWITCH_INTERVAL) {
            let nextGroup;
            do { nextGroup = Math.floor(Math.random() * vocabGroups.length); } while (nextGroup === currentTargetGroupId);
            currentTargetGroupId = nextGroup;
            lastSwitchTime = now;
            createFloatingText(canvas.width/2, canvas.height/3, '🚨 目標切換：' + vocabGroups[currentTargetGroupId].title, '#ffde00', 20);
            spawnRate = Math.max(35, spawnRate - 8);
        }

        if (frameCount - player.lastShot > player.fireRate) {
            bullets.push({ x: player.x - 12, y: player.y - 20, width: 4, height: 25, speed: 20 });
            bullets.push({ x: player.x + 12, y: player.y - 20, width: 4, height: 25, speed: 20 });
            player.lastShot = frameCount;
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].y -= bullets[i].speed;
            if (bullets[i].y < -20) bullets.splice(i, 1);
        }

        if (frameCount % Math.max(10, Math.floor(spawnRate)) === 0) spawnEnemy();

        for (let i = enemies.length - 1; i >= 0; i--) {
            let enemy = enemies[i];
            enemy.y += enemy.speed;
            if (enemy.hitEffect > 0) enemy.hitEffect--;
            
            if (enemy.y > canvas.height + enemy.height) { 
                enemies.splice(i, 1); 
                continue; 
            }

            for (let j = bullets.length - 1; j >= 0; j--) {
                let bullet = bullets[j];
                if (bullet.x > enemy.x - enemy.width/2 && bullet.x < enemy.x + enemy.width/2 &&
                    bullet.y > enemy.y - enemy.height/2 && bullet.y < enemy.y + enemy.height/2) {
                    
                    enemy.hp--;
                    bullets.splice(j, 1);
                    
                    if (enemy.hp > 0) {
                        enemy.hitEffect = 4;
                        createExplosion(bullet.x, enemy.y + enemy.height/2, '#00f3ff', false);
                    } else {
                        let isCorrect = (enemy.groupId === currentTargetGroupId);
                        if (isCorrect) {
                            score += 10;
                            createExplosion(enemy.x, enemy.y, '#00f3ff', true);
                            createFloatingText(enemy.x, enemy.y, 'CORRECT +10', '#00f3ff', 20);
                        } else {
                            score -= 10;
                            createExplosion(enemy.x, enemy.y, '#ff003c', true);
                            createFloatingText(enemy.x, enemy.y, 'WRONG -10', '#ff003c', 20);
                        }
                        enemies.splice(i, 1);
                    }
                    break;
                }
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        stars.forEach(star => {
            ctx.fillStyle = star.color;
            ctx.globalAlpha = star.size / 2;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        if (gameState !== 'PLAYING') return;

        bullets.forEach(bullet => {
            ctx.fillStyle = '#00f3ff';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00f3ff';
            ctx.fillRect(bullet.x - bullet.width/2, bullet.y, bullet.width, bullet.height);
            ctx.shadowBlur = 0;
        });

        enemies.forEach(enemy => {
            ctx.save();
            ctx.translate(enemy.x, enemy.y);
            const isHit = enemy.hitEffect > 0;
            
            ctx.shadowBlur = isHit ? 20 : 10;
            ctx.shadowColor = isHit ? '#fff' : '#ff003c';
            
            ctx.fillStyle = isHit ? '#ffffff' : 'rgba(15, 6, 12, 0.95)';
            ctx.strokeStyle = isHit ? '#fff' : '#ff003c';
            ctx.lineWidth = 2;
            
            ctx.beginPath();
            ctx.moveTo(-enemy.width/2 + 10, -enemy.height/2);
            ctx.lineTo(enemy.width/2 - 10, -enemy.height/2);
            ctx.lineTo(enemy.width/2, -enemy.height/2 + 10);
            ctx.lineTo(enemy.width/2, enemy.height/2 - 10);
            ctx.lineTo(enemy.width/2 - 10, enemy.height/2);
            ctx.lineTo(-enemy.width/2 + 10, enemy.height/2);
            ctx.lineTo(-enemy.width/2, enemy.height/2 - 10);
            ctx.lineTo(-enemy.width/2, -enemy.height/2 + 10);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            ctx.shadowBlur = 0;

            ctx.fillStyle = isHit ? '#000' : '#00f3ff';
            ctx.font = 'bold 15px "Noto Sans TC", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(enemy.text, 0, -4);

            const barWidth = enemy.width - 20;
            const barHeight = 5;
            const barY = enemy.height/2 - 10;
            
            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.fillRect(-barWidth/2, barY, barWidth, barHeight);
            
            const hpRatio = Math.max(0, enemy.hp / enemy.maxHp);
            ctx.fillStyle = hpRatio > 0.6 ? '#00f3ff' : (hpRatio > 0.3 ? '#ffde00' : '#ff003c');
            if (enemy.hp > 0) {
                ctx.shadowBlur = 5;
                ctx.shadowColor = ctx.fillStyle;
                ctx.fillRect(-barWidth/2, barY, barWidth * hpRatio, barHeight);
                ctx.shadowBlur = 0;
            }
            
            ctx.fillStyle = '#050a1f';
            for(let k = 1; k < enemy.maxHp; k++) {
                ctx.fillRect(-barWidth/2 + (barWidth / enemy.maxHp) * k - 0.5, barY, 1, barHeight);
            }

            ctx.restore();
        });

        ctx.save();
        ctx.translate(player.x, player.y);
        
        ctx.fillStyle = 'rgba(0, 243, 255, 0.05)';
        ctx.beginPath(); ctx.arc(0, 0, 36, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = 'rgba(0, 243, 255, 0.35)';
        ctx.lineWidth = 1; ctx.stroke();
        
        ctx.beginPath();
        ctx.arc(0, 0, 28, (frameCount*0.1)%Math.PI*2, (frameCount*0.1)%Math.PI*2 + Math.PI);
        ctx.strokeStyle = 'rgba(0, 243, 255, 0.55)';
        ctx.stroke();

        if (frameCount % 2 === 0) {
            ctx.fillStyle = '#00f3ff';
            ctx.shadowBlur = 15; ctx.shadowColor = '#00f3ff';
            ctx.beginPath();
            ctx.moveTo(-8, player.height/2 - 5);
            ctx.lineTo(8, player.height/2 - 5);
            ctx.lineTo(0, player.height/2 + 20 + Math.random()*10);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        ctx.fillStyle = '#1e1b4b';
        ctx.strokeStyle = '#00f3ff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -player.height/2 + 5);
        ctx.lineTo(player.width/2, player.height/2);
        ctx.lineTo(-player.width/2, player.height/2);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        
        ctx.fillStyle = '#4c1d95';
        ctx.beginPath();
        ctx.moveTo(0, -player.height/2);
        ctx.lineTo(6, player.height/2);
        ctx.lineTo(-6, player.height/2);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        
        ctx.fillStyle = '#ff003c';
        ctx.shadowBlur = 5; ctx.shadowColor = '#ff003c';
        ctx.beginPath();
        ctx.ellipse(0, -player.height/4 + 5, 4, 8, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        ctx.restore();

        particles.forEach(p => {
            ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
            ctx.shadowBlur = 5; ctx.shadowColor = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
            ctx.shadowBlur = 0;
        });
        ctx.globalAlpha = 1.0;

        floatingTexts.forEach(ft => {
            ctx.fillStyle = ft.color; ctx.globalAlpha = ft.life;
            ctx.font = `900 ${ft.fontSize}px "Orbitron", "Noto Sans TC", sans-serif`;
            ctx.textAlign = 'center';
            ctx.shadowBlur = 10; ctx.shadowColor = ft.color;
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.shadowBlur = 0;
        });
        ctx.globalAlpha = 1.0;
    }

    function gameLoop() {
        update();
        draw();
        animationId = requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>
</body>
</html>
